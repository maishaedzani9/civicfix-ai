name: Phase 1 Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate documentation and database contracts
        run: python scripts/validate_phase1.py

      - name: Run contract tests
        run: python -m unittest discover -s tests -v

      - name: Compile validation code
        run: python -m compileall scripts tests backend/app backend/tests

      - name: Run backend domain tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
